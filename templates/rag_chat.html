{% extends "base.html" %}
{% block title %}RAG Chat - Study Coach{% endblock %}
{% block content %}

<div class="container mt-5">
  <h2 class="text-center text-primary mb-4">
    <i class="bi bi-chat-left-text"></i> Ask Your Notes
  </h2>

  <div class="row justify-content-center">
    <div class="col-md-8">
      <div id="chatWindow" class="border rounded p-3 mb-3"
        style="height: 400px; overflow-y: auto; background-color: #f8f9fa">
        <!-- Chat messages appear here -->
      </div>

      <div class="input-group">
        <input type="text" id="query" class="form-control" placeholder="Type your question..." />
        <button id="askBtn" class="btn btn-danger">
          <i class="bi bi-send"></i> Ask
        </button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<!-- FIX: removed duplicate jQuery import (base.html already loads it) -->
<!-- FIX: use url_for via a JS variable instead of hardcoded /ask_rag -->
<script>
  const ASK_RAG_URL = "{{ url_for('ai.ask_rag') }}";

  function appendMessage(sender, message) {
    const chatWindow = $("#chatWindow");
    const msgDiv = $(`<div class="mb-2"><strong>${sender}:</strong> ${message}</div>`);
    chatWindow.append(msgDiv);
    chatWindow.scrollTop(chatWindow[0].scrollHeight);
  }

  $(document).ready(function () {
    $("#askBtn").click(function () {
      const query = $("#query").val().trim();
      if (!query) return;

      appendMessage("You", query);
      $("#query").val("");
      $("#askBtn").prop("disabled", true).html('<i class="bi bi-hourglass-split"></i> Thinking...');

      $.post(ASK_RAG_URL, { query: query }, function (data) {
        appendMessage("Study Coach", data.answer);
      }).fail(function () {
        appendMessage("Error", "Something went wrong. Please try again.");
      }).always(function () {
        $("#askBtn").prop("disabled", false).html('<i class="bi bi-send"></i> Ask');
      });
    });

    $("#query").keypress(function (e) {
      if (e.which === 13) $("#askBtn").click();
    });
  });
</script>
{% endblock %}
